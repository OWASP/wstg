<header class="site-header">
  <div class="container container-wide header-inner">
    <div class="header-left">
      <a href="{{ site.baseurl }}/" class="header-brand" aria-label="WSTG home">
        <img class="header-brand-shield" src="{{ site.baseurl }}/assets/images/wstg-shield.png" width="40" height="40" alt="">
        <span class="header-brand-name"><span class="wstg-wordmark">WSTG</span></span>
      </a>
    </div>
    <div class="header-actions">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Theme: system. Click to switch." title="Theme">
        <span class="theme-toggle-icon-wrap">
          <svg class="theme-toggle-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
          </svg>
        </span>
        <span class="theme-toggle-label" aria-hidden="true">Theme</span>
      </button>
      <a href="https://owasp.org/" class="ext-link" rel="noopener noreferrer" target="_blank" aria-label="OWASP (external)">
        <img class="owasp-wordmark-img" src="{{ site.baseurl }}/assets/images/owasp-logo-header.svg" alt="" width="133" height="40">
        <span class="sr-only"> (opens in new window)</span>
      </a>
    </div>
  </div>
</header>
