title: OWASP Web Security Testing Guide
description: >-
  The premier cybersecurity testing resource for web application developers
  and security professionals.
url: "https://wstg.owasp.org"
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - README.md
  - serve.sh

include:
  - llms.txt
  - llms-full.txt

defaults:
  - scope:
      path: ""
    values:
      layout: default
