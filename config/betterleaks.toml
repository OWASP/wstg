  } : r.status == 401 && (r.json?.error_code ?? "") == "INVALID_API_KEY" ? {
    "result": "invalid",
    "reason": "Invalid API key"
  } : validate.unknown(r)
'''
filter = '''
entropy(finding["secret"]) < 3.0
'''

