  } : r.status == 400 && k.status in [200, 403] ? {
    "result": "needs_validation",
    "reason": "Active Google API key not accepted by Gemini API",
    "metadata": {"active_google_key": true, "gemini_access": false}
  } : r.status == 400 && (r.body contains "API_KEY_INVALID") ? {
    "result": "invalid",
    "reason": "Unauthorized"
  } : r.status == 400 ? {
    "result": "invalid",
    "reason": "Unauthorized"
  } : validate.unknown(r))
'''
filter = '''
entropy(finding["secret"]) <= 4.0
'''

# ──────────────────────────────────────────────────────────────────────────────
# gcp-service-account
# ──────────────────────────────────────────────────────────────────────────────
[[rules]]
id = "gcp-service-account"
description = "Google (GCP) Service-account"
regex = '''\{[^{]+(?:(?:"private_key"\s*:\s*"-----BEGIN (?:RSA )?PRIVATE KEY-----[^}]+auth_provider_x509_cert_url)|(?:auth_provider_x509_cert_url[^}]+"private_key"\s*:\s*"-----BEGIN (?:RSA )?PRIVATE KEY-----))[^}]+\}'''
confidence = "high"
keywords = ["provider_x509"]
validate = '''
let r = gcp.validate(finding["secret"]); r.status == 200 ? {
  "result": "valid",
  "metadata": {"credential_type": r.credential_type, "project_id": r.project_id, "client_email": r.client_email}
} : r.status in [400, 401] ? {
    "result": "invalid",
    "metadata": {"error_code": r.error_code, "error_message": r.error_message}
  } : validate.unknown(r)

'''
filter = '''
containsAny(finding["secret"], ["image-pulling@authenticated-image-pulling.iam.gserviceaccount.com"])
'''

# ──────────────────────────────────────────────────────────────────────────────
# generic-api-key
# ──────────────────────────────────────────────────────────────────────────────
[[rules]]
id = "generic-api-key"
description = "Detected a Generic API Key, potentially exposing access to various services and sensitive operations."
regex = '''(?i)(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|secret|token)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
specificity = -100
confidence = "low"
keywords = [
    "access",
    "api",
    "auth",
    "key",
    "credential",
    "creds",
    "secret",
    "token",
]
filter = '''
// Reject implausible values before preparing context and confidence.
entropy(finding["secret"]) <= 3.5
|| failsTokenEfficiency(finding["secret"])
|| (
// Provider checks use a fixed window around the match, clamped to its line.
let providerMatchContext = finding["fragment_raw"][
  max(finding["match_start_idx"] - 150, finding["match_line_start_idx"]):
  min(finding["match_end_idx"] + 50, finding["match_line_end_idx"])
];

// Recreate the generic rule's former [\w.-]{0,50} preamble. Only the
// contiguous word, dot, and hyphen suffix immediately before the match counts.
let genericMatchPrefix = findMatch(
  finding["fragment_raw"][
    max(finding["match_start_idx"] - 50, finding["match_line_start_idx"]):
    finding["match_start_idx"]
  ],
  `[\w.-]{0,50}$`
);

// Recreate the generic rule's former regex which includes the [\w.-]{0,50} preamble.
let genericMatchContext =
  genericMatchPrefix +
  finding["fragment_raw"][finding["match_start_idx"]:finding["match_end_idx"]];

