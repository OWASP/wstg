# Linkspector config for OWASP WSTG
# Used by md-link-check.yml (PR) and md-link-check-full.yml (manual).
# Docs: https://github.com/UmbrellaDocs/linkspector#configuration
#
# Note: PR workflow may override `files:` at runtime so only changed
# Markdown is checked while relative links still resolve against the
# base-branch tree.

dirs:
  - .

excludedDirs:
  - ./.github
  - ./website

fileExtensions:
  - md

useGitIgnore: true

# Mirror (and slightly expand) the previous markdown-link-check ignores.
# Root-relative and ./ relative paths are resolved against the working
# tree; they are not external URLs and should not be HTTP-probed.
ignorePatterns:
  - pattern: "^/"
  - pattern: "^\\./"
  - pattern: "^https://www\\.nstalker\\.com"
  - pattern: "^https://www\\.kali\\.org"
  - pattern: "^https://.*\\.linkedin\\.com"
  - pattern: "^https://www\\.shodan\\.io"
  - pattern: "^https://developer\\.android\\.com"
  - pattern: "^https://github\\.com"
  # Common example / placeholder hosts that appear in guide content
  - pattern: "^https?://localhost"
  - pattern: "^https?://127\\.0\\.0\\.1"
  - pattern: "^https?://example\\.(com|org|net)"

# Accept success and a few codes that pure HTTP clients often mis-handle
# on bot-protected hosts. Puppeteer fallback still validates real pages.
aliveStatusCodes:
  - 200
  - 201
  - 202
  - 204
  - 403

followRedirects: true
timeout: 30000
retryCount: 3

userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0"

httpHeaders:
  - url: "https?://"
    headers:
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "en-US,en;q=0.5"
