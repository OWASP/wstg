name: Comment

on:
  workflow_run:
    workflows: ['Markdown Link Check', 'Markdown Lint Check', 'Markdown Terminology Lint Check']
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    steps:
      - name: Download Artifact
        id: download-artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/artifact

      - name: Manage PR Comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
          DOWNLOAD_OUTCOME: ${{ steps.download-artifact.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const conclusion = context.payload.workflow_run.conclusion;
            const downloadOk = process.env.DOWNLOAD_OUTCOME === 'success';

            // On failure, only minimize/post when the new artifact is available.
            // Otherwise keep the prior comment so feedback is not wiped.
            if (conclusion === 'failure' && !downloadOk) {
              console.log('Failure run but artifact download failed; skipping minimize and post');
              return;
            }

            // PR number from workflow_run event
            const pullRequests = context.payload.workflow_run.pull_requests || [];
            if (pullRequests.length === 0) {
              console.log('No pull_requests on workflow_run event; skipping');
              return;
            }

            const issue_number = pullRequests[0].number;
            if (!Number.isInteger(issue_number) || issue_number < 1) {
              console.log(`Invalid PR number from workflow_run: ${issue_number}`);
              return;
            }

            // Determine workflow identifier based on the triggering workflow
            const workflowName = context.payload.workflow_run.name;
            const workflowIdentifier = `<!-- workflow-comment: ${workflowName} -->`;

            // Minimize previous comments from this workflow
            try {
              // Get all comments on the PR (paginate to handle more than one page)
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  per_page: 100,
                }
              );

              // Find comments from this workflow authored by the GitHub Actions bot
              const workflowComments = comments.filter(comment =>
                comment.body &&
                comment.body.includes(workflowIdentifier) &&
                comment.user &&
                comment.user.login === 'github-actions[bot]'
              );

              // Minimize each previous comment with appropriate classifier
              const classifier = conclusion === 'success' ? 'RESOLVED' : 'OUTDATED';

              for (const comment of workflowComments) {
                try {
                  // Use GraphQL API to minimize comment with parameterized query
                  await github.graphql(
                    `mutation($commentId: ID!, $classifier: ReportedContentClassifiers!) {
                      minimizeComment(input: {subjectId: $commentId, classifier: $classifier}) {
                        minimizedComment {
                          isMinimized
                        }
                      }
                    }`,
                    {
                      commentId: comment.node_id,
                      classifier: classifier
                    }
                  );
                  console.log(`Minimized comment ${comment.id} as ${classifier}`);
                } catch (error) {
                  console.log(`Failed to minimize comment ${comment.id}: ${error.message}`);
                }
              }
            } catch (error) {
              console.log(`Error managing previous comments: ${error.message}`);
            }

            // Post new comment only on failure
            if (conclusion === 'failure') {
              try {
                // Check if artifact.txt exists before reading
                const artifactPath = path.join(process.env.ARTIFACT_DIR, 'artifact.txt');
                if (!fs.existsSync(artifactPath)) {
                  console.log('artifact.txt not found, skipping comment post');
                  return;
                }

                const MAX_ARTIFACT_CHARS = 60000;
                let artifactString = fs.readFileSync(artifactPath, 'utf8');
                // Strip C0 controls except tab/LF/CR
                artifactString = artifactString.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '');
                artifactString = artifactString.trimEnd();
                if (artifactString.length > MAX_ARTIFACT_CHARS) {
                  artifactString = artifactString.slice(0, MAX_ARTIFACT_CHARS) + '\n\n…(truncated)';
                }
                if (!artifactString) {
                  console.log('artifact.txt empty after sanitization, skipping comment post');
                  return;
                }

                const commentBody = `${workflowIdentifier}\n${artifactString}`;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  body: commentBody
                });
                console.log('Posted new comment with issues found');
              } catch (error) {
                console.log(`Failed to post comment: ${error.message}`);
                throw error;
              }
            } else {
              console.log('Workflow succeeded, no new comment needed');
            }
