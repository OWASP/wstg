# Build website/ from master and publish the static site to the gh-pages branch.
# Live: https://wstg.owasp.org/
#
# master holds guide + site source; the published artifact is pushed to gh-pages.
name: Deploy WSTG website

on:
  push:
    branches:
      - master
    paths:
      - "website/**"
      - "document/**"
      - ".github/workflows/deploy-website.yml"
    # A new release tag adds a version channel (newest tag becomes stable).
    tags:
      - 'v[0-9]*.[0-9]*'
      - '!v*-*'  # skip prereleases such as v5.0-rc1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wstg-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always build site source and latest content from master (also for
          # tag-triggered runs); tags are only read to discover versions.
          ref: master
          # Full history + tags so prepare_site.py can archive each release.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Prepare channel trees
        run: python3 website/scripts/prepare_site.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: website

      - name: Build Jekyll site
        working-directory: website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Copy markdown for LLM agents
        run: python3 website/scripts/copy_markdown_for_agents.py

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/_site
          publish_branch: gh-pages
          # Keeps Pages custom domain association across orphan publishes.
          cname: wstg.owasp.org
          # Prebuilt HTML; do not let GitHub run Jekyll on the branch.
          enable_jekyll: false
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy WSTG website"
