# TEMPORARY: manual test of the Google Drive upload, delete after verifying.
# Uploads the committed checklists/checklist.xlsx to the live Drive file (GDRIVEFILEID),
# bypassing the CHANGED gate in build-checklists.yml. Check the file's version history in Drive.
name: Test Google Drive Upload (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"
    - name: Install Dependencies
      run: pip install -r .github/requirements.txt
    - name: Set XLSX Publishing Secrets
      run: echo "$GDRIVECREDSFILE" | base64 -d > credentials.json
      env:
        GDRIVECREDSFILE: ${{ secrets.GDRIVECREDSFILE }}
    - name: Publish XLSX file to Google Drive
      run: python3 ./.github/xlsx/scripts/upload-to-google-drive.py "$GDRIVE_FILE_ID"
      env:
        GDRIVE_FILE_ID: ${{ secrets.GDRIVEFILEID }}
