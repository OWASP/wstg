name: Betterleaks secret scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  betterleaks:
    name: Scan pull request history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted workflow files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted

      - name: Checkout pull request as scan input
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: scan-repo
          persist-credentials: false

      - name: Run Betterleaks
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}/trusted:/trusted:ro" \
            -v "${GITHUB_WORKSPACE}/scan-repo:/scan-repo:ro" \
            ghcr.io/betterleaks/betterleaks:v2.0.0-rc.1@sha256:bd1bfb5a77122e56c0c6b2b0a4d455b1383f86ddd8bf1ec5397a0c25cd368f65 \
            --config /trusted/config/betterleaks.toml \
            git /scan-repo
