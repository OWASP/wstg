name: Markdown Link Check

on:
  pull_request:
    branches:
      - master
    paths:
      - "**.md"
      - "!.github/**"

jobs:
  link-check:
    permissions:
      contents: read
      pull-requests: write # reviewdog PR annotations / comments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OWASP/wstg
          ref: master
          path: base
          persist-credentials: false

      - name: Get Changed Files
        # Use base/head SHAs from the PR event for fork-safe, PR-accurate changed-file detection.
        # github.base_ref resolves differently for forks, while base.sha/head.sha are always correct.
        id: files
        uses: ./.github/actions/get-changed-files
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          base_repo: ${{ github.event.pull_request.base.repo.full_name }}
          repo_path: .

      - name: Prepare base tree and Linkspector config
        id: prepare
        env:
          FILES: "${{ steps.files.outputs.files_updated }}"
          ALL_CHANGED: "${{ steps.files.outputs.all_changed }}"
        shell: bash
        run: |
          set -euo pipefail

          readarray -t files_arr <<< "$FILES"
          readarray -t all_arr <<< "$ALL_CHANGED"

          echo "The following files were changed or created:"
          printf '%s\n' "${files_arr[@]}"

          # Copy all changed files (md + images etc.) into base/ so relative
          # link targets exist when we check .md files against the base tree.
          for FILE in "${all_arr[@]}"; do
            [ -z "$FILE" ] && continue
            mkdir -p "base/$(dirname "$FILE")"
            cp "$FILE" "base/$FILE"
          done

          # Build a run-specific config: shared settings from base + only the
          # changed Markdown files (paths relative to base/).
          CONFIG_SRC="base/.github/configs/linkspector.yml"
          CONFIG_RUN="base/.github/configs/linkspector.pr.yml"

          if [ ! -f "$CONFIG_SRC" ]; then
            echo "::error::Missing $CONFIG_SRC (config is always taken from the base branch)"
            exit 1
          fi

          has_md=0
          md_list=""
          for FILE in "${files_arr[@]}"; do
            [ -z "$FILE" ] && continue
            if [[ "$FILE" == *.md ]]; then
              # Skip paths under .github/ or website/ (same as previous behaviour)
              case "$FILE" in
                .github/*|website/*) continue ;;
              esac
              md_list="${md_list}  - ${FILE}"$'\n'
              has_md=1
            fi
          done

          if [ "$has_md" -eq 0 ]; then
            echo "No guide Markdown files to check; skipping Linkspector."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "# Generated for this PR — do not commit"
            echo "files:"
            printf '%s' "$md_list"
            echo
            # Reuse ignore/HTTP settings from the shared base config
            # (skip keys that only apply to full-repo scans).
            awk '
              BEGIN { skip=0 }
              /^dirs:/ { skip=1; next }
              /^excludedDirs:/ { skip=1; next }
              /^fileExtensions:/ { skip=1; next }
              /^files:/ { skip=1; next }
              /^[a-zA-Z]/ { skip=0 }
              skip==0 { print }
            ' "$CONFIG_SRC"
          } > "$CONFIG_RUN"

          echo "--- generated Linkspector config ---"
          cat "$CONFIG_RUN"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Linkspector (PR)
        if: steps.prepare.outputs.skip != 'true'
        uses: UmbrellaDocs/action-linkspector@568ec8d29fa92b31fd9ea5381e155c51e922af83
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workdir: base
          config_file: .github/configs/linkspector.pr.yml
          reporter: github-pr-review
          filter_mode: file
          fail_level: any
          level: error
          show_stats: "true"
          tool_name: Linkspector

      - name: Create Artifact for Comment
        if: failure()
        run: |
          {
            echo "**Linkspector reported broken links in this PR.**"
            echo
            echo "See the review comments / check annotations for details."
            echo "Config: \`.github/configs/linkspector.yml\` (base branch)."
          } > artifact.txt
          cat artifact.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload List of Broken Links
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact
          path: artifact.txt
