name: Markdown Link Check (Full Repository)

on:
  workflow_dispatch:

jobs:
  link-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OWASP/wstg
          ref: master
          path: base
          persist-credentials: false

      - name: Linkspector (full repository)
        uses: UmbrellaDocs/action-linkspector@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workdir: base
          config_file: .github/configs/linkspector.yml
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
          level: error
          show_stats: "true"
          tool_name: Linkspector

      - name: Create Summary
        if: failure()
        run: |
          {
            echo "**Linkspector reported broken links in the full repository check.**"
            echo
            echo "See the job log and check annotations for details."
            echo "Config: \`.github/configs/linkspector.yml\`."
          } > artifact.txt
          cat artifact.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload List of Broken Links
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: broken-links
          path: artifact.txt
