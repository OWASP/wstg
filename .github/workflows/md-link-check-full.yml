name: Markdown Link Check (Full Repository)

on:
  workflow_dispatch:

jobs:
  link-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OWASP/wstg
          ref: master
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Cache npm Global
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-global-markdown-link-check
      - name: Install Dependencies
        run: npm install -g markdown-link-check@3.11.0
      - name: Link Check (Full Repository)
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking all Markdown files in repository..."
          touch log err
          find . -name "*.md" -not -path "./.git/*" -not -path "./website/*" -not -path "./.github/*" | while read file; do
            markdown-link-check -q -v -c ./.github/configs/markdown-link-check-config.json "$file" 1>> log 2>> err || true
          done
          if grep -q "ERROR:" err ; then exit 1 ; else echo -e "No broken links found."; fi
          echo "--- markdown-link-check output ---"
          cat log
          cat err
      - name: Create Summary
        if: failure()
        run: |
          {
            echo "**Broken links found in full repository check.**"
            echo
            echo "See the job logs above for details."
            echo "Config: \`.github/configs/markdown-link-check-config.json\`"
          } > artifact.txt
          cat artifact.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-link-check-report
          path: artifact.txt
