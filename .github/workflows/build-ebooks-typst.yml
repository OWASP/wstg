name: Build Ebooks (Modern)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '4.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install Typst
        run: |
          TYPST_VERSION=$(curl -s https://api.github.com/repos/typst/typst/releases/latest | grep tag_name | cut -d '"' -f 4)
          curl -L "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o typst.tar.xz
          tar -xJf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          rm -rf typst.tar.xz typst-x86_64-unknown-linux-musl

      - name: Generate Ebooks
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          BUILD_DIR="build-ebooks"
          mkdir -p "$BUILD_DIR"

          mapfile -t MD_FILES < <(python3 .github/ebooks/list-chapters.py document)
          if [ ${#MD_FILES[@]} -eq 0 ]; then
            echo "Error: No markdown files found in document/"
            exit 1
          fi

          # Every chapter dir so relative images/ resolve
          RESOURCE_PATH=".:document:$(find document -type d | paste -sd: -)"

          echo "Converting Markdown → Typst (${#MD_FILES[@]} files)..."
          pandoc "${MD_FILES[@]}" \
            --resource-path="$RESOURCE_PATH" \
            --extract-media="$BUILD_DIR/media" \
            -o "$BUILD_DIR/body.typ"

          python3 .github/ebooks/fix-typst-body.py \
            "$BUILD_DIR/body.typ" \
            .github/ebooks/pandoc-defs.typ \
            "$BUILD_DIR/content.typ"

          echo "Compiling Typst → PDF..."
          typst compile \
            --root . \
            --input "version=${VERSION}" \
            .github/ebooks/main.typ \
            "$BUILD_DIR/wstg-typst-${VERSION}.pdf"

          echo "Generating EPUB..."
          CSS_ARG=()
          if [ -f .github/epub/assets/epub-style.css ]; then
            CSS_ARG=(--css .github/epub/assets/epub-style.css)
          fi
          pandoc "${MD_FILES[@]}" "${CSS_ARG[@]}" \
            --resource-path="$RESOURCE_PATH" \
            -o "$BUILD_DIR/wstg-typst-${VERSION}.epub"

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wstg-ebooks-${{ github.event.inputs.version }}
          path: build-ebooks/*
