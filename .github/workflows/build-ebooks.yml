name: Build Ebooks

on:
  push:
    tags: 
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version?'
        required: true
        default: '4.x'
jobs:
  build:
    if: github.actor == 'kingthorin' || github.actor == 'ThunderSon' || github.actor == 'rejahrehim' || github.actor == 'victoriadrake'
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
    - name: Setup Action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: 24
        package-manager-cache: false
    - name: SetUp python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y libgbm1 chromium-browser pandoc
        sudo snap install pdftk
        npm install -g md-to-pdf
    - name: Configure Puppeteer for CI
      run: |
        CHROMIUM_PATH=$(command -v chromium-browser || command -v chromium) || {
          echo "Error: No Chromium binary found on PATH" >&2
          exit 1
        }
        echo "PUPPETEER_EXECUTABLE_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
        TMP_PDF_CONFIG=$(mktemp) || {
          echo "Error: Failed to create temporary file for pdf-config.json" >&2
          exit 1
        }
        if ! jq '.puppeteerLaunchOptions.args += ["--no-sandbox", "--disable-setuid-sandbox"]' \
            .github/pdf/pdf-config.json > "$TMP_PDF_CONFIG"; then
          echo "Error: Failed to update pdf-config.json with CI launch options" >&2
          exit 1
        fi
        mv "$TMP_PDF_CONFIG" .github/pdf/pdf-config.json
    - name: Get Tag Version
      if: github.event_name == 'push'
      id: vars
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
    - name: Run Push Build
      if: github.event_name == 'push'
      env:
        VERSION: ${{ steps.vars.outputs.tag }}
      run: |
        bash ./.github/pdf/scripts/make-pdf.sh "$VERSION"
        bash ./.github/epub/scripts/make-epub.sh "$VERSION"
    - name: Run Workflow Build
      if: github.event_name == 'workflow_dispatch'
      env:
        VERSION: ${{ github.event.inputs.version }}
      run: |
        bash ./.github/pdf/scripts/make-pdf.sh "$VERSION"
        bash ./.github/epub/scripts/make-epub.sh "$VERSION"
    - name: Upload Ebooks for Release
      if: github.event_name == 'push'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wstg-${{ steps.vars.outputs.tag }}-ebooks
        path: |
          ./build/wstg-${{ steps.vars.outputs.tag }}.pdf
          ./build/wstg-${{ steps.vars.outputs.tag }}.epub
    - name: Attach PDF and Epub
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wstg-${{ github.event.inputs.version }}-ebooks
        path: |
          ./build/wstg-${{ github.event.inputs.version }}.pdf
          ./build/wstg-${{ github.event.inputs.version }}.epub
  release:
    if: github.event_name == 'push'
    needs: build
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download Ebooks
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: wstg-${{ needs.build.outputs.tag }}-ebooks
        path: .
    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.build.outputs.tag }}
      run: |
        set -euo pipefail
        pdf="./build/wstg-${TAG}.pdf"
        epub="./build/wstg-${TAG}.epub"
        if [ ! -f "$pdf" ] || [ ! -f "$epub" ]; then
          echo "Missing release artifacts: $pdf and/or $epub" >&2
          exit 1
        fi
        gh release create "$TAG" \
          --title "Release ${TAG}" \
          --prerelease \
          "$pdf" \
          "$epub"
